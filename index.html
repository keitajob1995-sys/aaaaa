<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/style.css" />
    <title>問題練習ツール</title>
  </head>
  <body>
    <div class="header">
      <div class="title-area">
        <h2>自習ツール</h2>
        <div id="score-display" class="score-display">正解数：0 / 0</div>
      </div>
      <button id="addSetBtn">＋ 問題追加</button>
      <button id="shuffleBtn">ランダム並び替え</button>
      <button id="clearUserAnswersBtn">全回答欄をクリア</button>
      <button id="showAllAnswersBtn">答えを全て表示</button>
      <button id="copyAllBtn">テキストとしてコピー</button>
      <button id="reviewWrongBtn">復習モード</button>
      <button id="showAllSetsBtn">全セットを再表示</button>
      <button id="backToTopBtn">TOPへ戻る</button>
    </div>
    <div id="container">
      <template id="qa-template">
        <div class="qa-set">
           <div class="set-number"></div>
          <div class="question-box">
            <label>問題：</label><br />
            <textarea class="question"></textarea>
          </div>
          <div class="user-answer-box">
            <label>回答欄（自分用）：</label><br />
            <textarea class="user-answer"></textarea>
            <button class="mark-correct-btn">✔</button>
            <button class="mark-wrong-btn">✖</button>
          </div>
          <div class="answer-box">
            <label>答え（正解）：</label><br />
            <textarea class="answer-text"></textarea>
            <button class="hide-answer-btn">隠す</button>
            <button class="show-answer-btn">表示</button>
            <button class="delete-set-btn">削除</button>
          </div>
        </div>
      </template>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
